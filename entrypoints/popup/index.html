<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Language Weave</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Language Weave</h1>
      <div class="flags" id="languages" role="radiogroup" aria-label="Language"></div>
      <div class="modes" role="radiogroup" aria-label="Mode">
        <label><input type="radio" name="mode" value="page" /> This page</label>
        <label><input type="radio" name="mode" value="lesson" /> Lesson</label>
      </div>
    </header>
    <div class="settings" id="pageSettings" hidden>
      <label for="level">Level</label>
      <div class="level">
        <input type="range" id="level" min="0" step="1" />
        <div class="marks" id="levelMarks" aria-hidden="true"></div>
      </div>
      <label><input type="checkbox" id="weavePage" /> Weave the page</label>
    </div>
    <div class="settings" id="lessonSettings" hidden>
      <label>
        <span class="visually-hidden">Lesson</span>
        <select id="lesson"></select>
      </label>
    </div>
    <div class="settings" id="lessonActions" hidden>
      <button type="button" id="markPage">Mark this page</button>
      <button type="button" id="weaveWords">Weave this page</button>
    </div>
    <p id="summary" role="status"></p>
    <p id="cost"></p>
    <p id="notice" hidden></p>
    <button type="button" id="reloadExtension" hidden>Reload Language Weave</button>
    <div id="list"></div>
    <footer>
      <button type="button" id="weave" hidden>Weave this page</button>
      <button type="button" id="restore" hidden>Restore English</button>
      <span id="today"></span>
      <a href="#" id="words">Words</a>
      <a href="#" id="progress">Progress</a>
      <a href="#" id="options">Options</a>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
